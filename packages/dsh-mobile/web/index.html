<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>DSH</title>
<style>
:root{
  color-scheme:dark;
  /* 墨黑底 + 单一信号色（铜橙）。形状规则：分组容器 20px、组内行 0、按钮/胶囊全圆、输入框 22px */
  --bg:#08090b;
  --surface:#111316;
  --surface-2:#171a1f;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.14);
  --fg:#eceef2;
  --dim:#a2a7b2;
  --dim2:#6b7280;
  --accent:#ff8a4c;
  --accent-ink:#14100d;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.13); --ok-fg:#6ee7a5;
  --err:#f87171; --err-soft:rgba(248,113,113,.13);
  --r-lg:20px; --r-md:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-native="1"]{--safe-t:42px;--safe-b:10px}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f2ee;
  --surface:#ffffff;
  --surface-2:#faf8f5;
  --line:rgba(23,24,26,.085);
  --line-2:rgba(23,24,26,.16);
  --fg:#17181a;
  --dim:#5f6066;
  --dim2:#8d8e94;
  --accent:#c2410c;
  --accent-ink:#fff8f4;
  --ok:#15803d; --ok-soft:rgba(21,128,61,.1); --ok-fg:#15803d;
  --err:#b91c1c; --err-soft:rgba(185,28,28,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 "HarmonyOS Sans SC","HarmonyOS Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  letter-spacing:.005em;
  overscroll-behavior:none;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- shell ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex;animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:4px;
  padding:calc(var(--safe-t) + 4px) 10px 8px;
  background:var(--bg);position:relative;z-index:5;
}
.iconbtn{
  width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
  color:var(--dim);flex:0 0 auto;transition:background .12s,color .12s;
}
.iconbtn:active{background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:16px;font-weight:620;letter-spacing:-.012em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.title small{display:block;font-size:11.5px;font-weight:400;color:var(--dim2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.spacer{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.err{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}

/* ---------- home ---------- */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px calc(var(--safe-b) + 26px);-webkit-overflow-scrolling:touch}
.hero{position:relative;padding:10px 2px 0;background:none;border:0;border-radius:0;color:var(--fg)}
.hero h1{margin:0;font-size:31px;line-height:1.02;font-weight:760;letter-spacing:-.03em}
.hero .sub{margin-top:7px;font-size:12.5px;color:var(--dim);letter-spacing:.02em}
.hero .stat{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.hero .stat div{position:relative;padding-left:15px;min-width:0}
.hero .stat div:first-child{padding-left:0}
.hero .stat div+div::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.hero .stat b{display:block;font-size:25px;font-weight:700;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.hero .stat span{display:block;margin-top:7px;font-size:10.5px;color:var(--dim2);letter-spacing:.1em}
.online{
  position:absolute;top:12px;right:2px;display:inline-flex;align-items:center;gap:7px;
  font-size:11px;color:var(--dim);letter-spacing:.02em;
}
.sect{margin:28px 2px 10px;display:flex;align-items:center;gap:8px}
.sect h2{margin:0;font-size:10.5px;font-weight:620;letter-spacing:.15em;color:var(--dim2);text-transform:uppercase}
.sect .spacer{flex:1}
.sect button{font-size:12.5px;color:var(--accent);letter-spacing:.01em;padding:2px 2px}
.sect button:active{opacity:.6}

/* ---------- grouped rows ---------- */
.rows{
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
}
.row{display:flex;align-items:center;gap:12px;padding:14px 15px;position:relative;
  border:0;border-radius:0;background:transparent;transition:background .12s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .body{flex:1;min-width:0}
.row .ttl{font-size:14.5px;font-weight:560;letter-spacing:-.008em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--dim2);margin-top:4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .right{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.tag{font-size:10.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);
  color:var(--dim);letter-spacing:.02em;white-space:nowrap}
.tag.run{background:var(--ok-soft);color:var(--ok-fg)}
.grouphead{margin:24px 2px 9px;font-size:10.5px;color:var(--dim2);letter-spacing:.15em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grouphead .n{color:var(--dim2);opacity:.7;letter-spacing:.02em;text-transform:none}
.grouphead+.rows{margin-top:0}
.rows+.grouphead{margin-top:26px}

.empty{text-align:center;color:var(--dim2);font-size:13px;padding:44px 0;line-height:1.7}
.search{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:10px 13px;margin:4px 0 10px;
}
.search svg{width:15px;height:15px;stroke:var(--dim2);fill:none;stroke-width:2;flex:0 0 auto}
.search input{flex:1;background:none;border:0;outline:none;font-size:14.5px;letter-spacing:0}
.search input::placeholder{color:var(--dim2)}

/* ---------- chat ---------- */
#chatScreen .scroll{padding-bottom:10px}
.msg{margin:0 0 20px}
.msg .who{font-size:10px;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px 2px}
.bub{padding:0;border-radius:0;font-size:15px;line-height:1.68;word-break:break-word;
  white-space:pre-wrap;color:var(--fg);letter-spacing:.004em}
.msg.a .bub{background:none;border:0}
.msg.u .bub{
  background:var(--accent);color:var(--accent-ink);padding:11px 15px;font-size:14.5px;line-height:1.6;
  border-radius:18px 18px 6px 18px;margin-left:52px;
}
.bub code{background:var(--surface-2);padding:1.5px 5px;border-radius:6px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg)}
.bub pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px;overflow-x:auto;margin:10px 0;font-size:12px;line-height:1.55}
.bub pre code{background:none;padding:0;font-size:12px;color:var(--dim)}
.msg.u .bub code{background:rgba(0,0,0,.14);color:var(--accent-ink)}
.more{margin-top:9px;font-size:12.5px;color:var(--accent);display:inline-block}
.clamp{display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}

.composer{
  background:linear-gradient(to top,var(--bg) 74%,rgba(0,0,0,0));
  padding:10px 12px calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:8px;
}
.composer .tools{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim2);padding:0 2px}
.composer .tools .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:11.5px;
  max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.pill:active{background:var(--surface-2)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.inputrow{display:flex;align-items:flex-end;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:5px 5px 5px 15px;transition:border-color .15s}
.inputrow:focus-within{border-color:var(--line-2)}
.inputrow textarea{
  flex:1;min-height:36px;max-height:132px;resize:none;background:none;border:0;
  border-radius:0;padding:8px 0;outline:none;font-size:15px;line-height:1.4;
}
.inputrow textarea::placeholder{color:var(--dim2)}
.send{
  width:38px;height:38px;border-radius:999px;background:var(--accent);display:grid;place-items:center;
  flex:0 0 auto;transition:opacity .15s,transform .12s;
}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.3}
.send svg{width:17px;height:17px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheets ---------- */
#sheet,#msheet,#ssheet{position:fixed;inset:0;display:none;z-index:20}
#msheet,#ssheet{z-index:21}
#sheet.on,#msheet.on,#ssheet.on{display:block}
#sheet .mask,#msheet .mask,#ssheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet .panel,#msheet .panel,#ssheet .panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:10px 18px calc(var(--safe-b) + 20px);max-height:78%;overflow:auto;
  animation:rise .24s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel,#msheet .panel,#ssheet .panel{animation:none}}
#sheet .panel::before,#msheet .panel::before,#ssheet .panel::before{
  content:"";display:block;width:36px;height:4px;border-radius:999px;background:var(--line-2);
  margin:0 auto 14px;
}
#sheet h3,#msheet h3,#ssheet h3{margin:0 0 14px;font-size:15px;font-weight:620;letter-spacing:-.01em}
.statrow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.statrow:last-child{border-bottom:0}
.statrow .k{color:var(--dim2);font-size:12.5px}
.statrow .v{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mgroup{margin:18px 0 8px;font-size:10.5px;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase}
.mgroup:first-child{margin-top:0}
.mrow{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid transparent;margin-bottom:8px;transition:border-color .15s}
.mrow.on{border-color:var(--accent);background:var(--surface-2)}
.mrow .mbody{flex:1;min-width:0}
.mrow .mname{font-size:13.5px;font-weight:600;letter-spacing:-.008em}
.mrow .mdesc{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.5}
.mrow .mcheck{font-size:11px;color:var(--accent);flex:0 0 auto;padding-top:2px}
.efforts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.efforts span{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--surface);
  color:var(--dim);border:1px solid var(--line)}
.efforts span.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--dim2);margin-bottom:7px;
  letter-spacing:.08em;text-transform:uppercase}
.field input{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 13px;outline:none;font-size:13.5px}
.field input:focus{border-color:var(--line-2)}
.btn{width:100%;padding:14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-size:14.5px;font-weight:650;text-align:center;letter-spacing:-.005em;transition:transform .12s}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--surface-2);color:var(--fg);margin-top:10px;border:1px solid var(--line)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);
  transform:translateX(-50%) translateY(8px);
  background:var(--surface-2);color:var(--fg);border:1px solid var(--line);
  font-size:12.5px;padding:10px 16px;border-radius:999px;
  opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:82%;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.28);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 设置页 ---------- */
#settingsScreen .sect{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
#settingsScreen .sect h2{font-size:10.5px;font-weight:620;color:var(--dim2);letter-spacing:.15em;margin:0;text-transform:uppercase}
#settingsScreen .rows{margin:0 0 4px}
#settingsScreen .rows .row{padding:15px 16px}
#settingsScreen .rows .row .ttl{font-size:15px}
#settingsScreen .rows .row .meta{font-size:12.5px;color:var(--dim);margin-top:4px;word-break:break-all;white-space:normal}
#settingsScreen .pill{max-width:none;padding:8px 15px;font-size:12.5px}
#settingsScreen .scroll{padding-left:16px;padding-right:16px}
/* ---------- home header ---------- */
.hostbar{flex:1;min-width:0;padding-left:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hostbar small{font-size:11.5px;font-weight:400;color:var(--dim2);letter-spacing:.01em}
.hero .sub{display:none}
.hero{padding-top:4px}

</style>
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="homeScreen" class="screen on">
    <div class="topbar">
      <div class="hostbar"><small id="hostLine">正在连接…</small></div>
      <div class="dot" id="homeDot"></div>
      <button class="iconbtn" id="openSettings" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.09A1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 20.96 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="scroll">
      <div class="hero">
        <div class="online"><span class="dot ok" id="heroDot"></span><span id="heroState">电脑在线</span></div>
        <h1>DSH MOBILE</h1>
        <div class="sub" id="heroHost">DSH 主机</div>
        <div class="stat">
          <div><b id="statSessions">—</b><span>会话</span></div>
          <div><b id="statRunning">—</b><span>运行中</span></div>
          <div><b id="statWeek">—</b><span>本周</span></div>
        </div>
      </div>

      <div class="sect"><h2>最近会话</h2><div class="spacer"></div>
        <button id="refreshHome">刷新</button></div>
      <div class="rows" id="recentRows"><div class="empty"><span class="spin"></span> 加载中…</div></div>

      <div class="sect"><h2>操作</h2></div>
      <div class="rows">
        <div class="row" id="gotoAgents">
          <div class="body"><div class="ttl">智能体团队</div>
            <div class="meta">子智能体与团队任务</div></div>
          <div class="right"><span class="tag" id="agentsBadge">›</span></div>
        </div>
        <div class="row" id="gotoList">
          <div class="body"><div class="ttl">打开会话列表</div>
            <div class="meta">全部会话，按工作区分组</div></div>
          <div class="right"><span class="tag">›</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="settingsScreen" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back="home" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title">设置</div>
      <div style="width:38px"></div>
    </div>
    <div class="scroll" style="padding-top:8px">
      <div class="sect"><h2>外观</h2></div>
      <div class="rows">
        <div class="row">
          <div class="body"><div class="ttl">主题</div>
            <div class="meta">深色 / 浅色 / 跟随系统</div></div>
        </div>
        <div class="row">
          <div class="body">
            <div class="right" style="gap:8px">
              <button class="pill" id="themeDark" data-theme-btn="dark">深色</button>
              <button class="pill" id="themeLight" data-theme-btn="light">浅色</button>
              <button class="pill" id="themeAuto" data-theme-btn="auto">跟随系统</button>
            </div>
          </div>
        </div>
      </div>

      <div class="sect"><h2>连接</h2></div>
      <div class="rows">
        <div class="row" id="openConn">
          <div class="body"><div class="ttl">服务器与令牌</div>
            <div class="meta" id="connMeta">—</div></div>
          <div class="right"><span class="tag">›</span></div>
        </div>
        <div class="row" id="testConn">
          <div class="body"><div class="ttl">测试连接</div>
            <div class="meta" id="testMeta">点一下探测服务端</div></div>
          <div class="right"><span class="dot" id="testDot"></span></div>
        </div>
      </div>

      <div class="sect"><h2>存储</h2></div>
      <div class="rows">
        <div class="row">
          <div class="body"><div class="ttl">本地占用</div>
            <div class="meta" id="storeMeta">—</div></div>
          <div class="right"><button id="clearCache" class="pill" style="min-width:64px">清空</button></div>
        </div>
      </div>

      <div class="sect"><h2>关于</h2></div>
      <div class="rows">
        <div class="row">
          <div class="body"><div class="ttl">dsh-mobile</div>
            <div class="meta" id="aboutMeta">—</div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 智能体团队 ============ -->
  <section id="agentsScreen" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back="home" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title">智能体团队<small id="agentsCount">—</small></div>
      <button class="iconbtn" id="refreshAgents" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="scroll" style="padding-top:6px">
      <div id="agentsBody"><div class="empty"><span class="spin"></span> 加载中…</div></div>
    </div>
  </section>

  <!-- ============ 会话列表 ============ -->
  <section id="listScreen" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back="home" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title">会话<small id="listCount">—</small></div>
      <button class="iconbtn" id="refreshList" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="scroll" style="padding-top:2px">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="搜索会话标题" autocomplete="off">
      </div>
      <div id="listBody"><div class="empty"><span class="spin"></span> 加载中…</div></div>
    </div>
  </section>

  <!-- ============ 会话详情 ============ -->
  <section id="chatScreen" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back="list" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title" id="chatTitle">会话<small id="chatSub"></small></div>
      <div class="dot" id="chatDot"></div>
      <button class="iconbtn" id="refreshChat" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="scroll" id="chatScroll">
      <div class="empty"><span class="spin"></span> 加载中…</div>
    </div>
    <div class="composer">
      <div class="tools">
        <span class="pill" id="modelPill" role="button" tabindex="0">—</span>
        <span id="turnLine" role="button" tabindex="0"></span>
      </div>
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="描述你想要构建的内容"
          enterkeyhint="send" autocomplete="off"></textarea>
        <button class="send" id="sendBtn" disabled aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>

<!-- ============ 设置 ============ -->
<div id="sheet">
  <div class="mask" data-close-sheet></div>
  <div class="panel">
    <h3>连接设置</h3>
    <div class="field"><label>服务器地址</label>
      <input id="cfgBase" placeholder="http://192.168.1.3:8901" autocomplete="off"></div>
    <div class="field"><label>访问令牌</label>
      <input id="cfgToken" placeholder="token" autocomplete="off"></div>
    <button class="btn" id="saveCfg">保存并重连</button>
    <button class="btn ghost" data-close-sheet>取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ 模型选择 ============ -->
<div id="msheet">
  <div class="mask" data-close-msheet></div>
  <div class="panel">
    <h3>更换模型</h3>
    <div id="mList"><div class="empty"><span class="spin"></span> 读取模型目录…</div></div>
    <button class="btn ghost" data-close-msheet>关闭</button>
  </div>
</div>

<!-- ============ 运行统计 ============ -->
<div id="ssheet">
  <div class="mask" data-close-ssheet></div>
  <div class="panel">
    <h3>运行统计</h3>
    <div id="sList"></div>
    <button class="btn ghost" data-close-ssheet>关闭</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const qs = new URLSearchParams(location.search);
  if (qs.get('native') === '1') document.documentElement.dataset.native = '1';
  const LS = {
    base: 'dsh.base', token: 'dsh.token', theme: 'dsh.theme',
  };

  let base = (qs.get('base') || localStorage.getItem(LS.base) || location.origin).replace(/\/+$/, '');
  let token = qs.get('t') || localStorage.getItem(LS.token) || '';
  if (qs.get('t')) localStorage.setItem(LS.token, token);
  if (qs.get('base')) localStorage.setItem(LS.base, base);

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  const state = {
    sessions: [],
    current: null,
    messages: [],
    expanded: new Set(),
    loadingChat: false,
    timer: null,
  };

  // ---------- helpers ----------
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('on'), 2200);
  }

  async function api(path, opts) {
    const res = await fetch(base + path, Object.assign({
      headers: { authorization: 'Bearer ' + token },
    }, opts || {}));
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error || ''; } catch (e) {}
      throw new Error(res.status + ' ' + (detail || res.statusText));
    }
    return res.json();
  }

  function ago(ms) {
    if (!ms) return '';
    const d = Date.now() - ms;
    if (d < 60e3) return '刚刚';
    if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
    if (d < 86400e3) return Math.floor(d / 3600e3) + ' 小时前';
    if (d < 7 * 86400e3) return Math.floor(d / 86400e3) + ' 天前';
    const dt = new Date(ms);
    return (dt.getMonth() + 1) + '-' + dt.getDate();
  }

  function shortCwd(cwd) {
    if (!cwd) return '';
    const parts = cwd.split(/[\\/]+/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : cwd;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  // Deliberately tiny: fenced code, inline code, bold, then newlines.
  function render(text) {
    const blocks = [];
    let out = String(text).replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    out = esc(out)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[Number(i)]);
    return out;
  }

  // ---------- screens ----------
  function show(name) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
    const target = document.getElementById(name + 'Screen');
    if (target) target.classList.add('on');
    if (name !== 'chat') stopPolling();
  }

  // ---------- sessions ----------
  async function loadSessions() {
    const data = await api('/api/sessions');
    state.sessions = data.sessions || [];
    return state.sessions;
  }

  function sessionRow(s, onClick) {
    const row = el('div', 'row');
    const body = el('div', 'body');
    body.appendChild(el('div', 'ttl', s.title || '(untitled)'));
    const meta = el('div', 'meta');
    const bits = [];
    if (s.cwd) bits.push(shortCwd(s.cwd));
    if (s.updatedAt) bits.push(ago(s.updatedAt));
    meta.textContent = bits.join(' · ');
    body.appendChild(meta);
    row.appendChild(body);
    const right = el('div', 'right');
    if (s.running) right.appendChild(el('span', 'tag run', '运行中'));
    row.appendChild(right);
    row.addEventListener('click', () => onClick(s));
    return row;
  }

  async function paintRecent() {
    const rows = $('#recentRows');
    try {
      const list = await loadSessions();
      const running = list.filter((s) => s.running).length;
      const week = list.filter((s) => Date.now() - (s.updatedAt || 0) < 7 * 86400e3).length;
      $('#statSessions').textContent = String(list.length);
      $('#statRunning').textContent = String(running);
      $('#statWeek').textContent = String(week);
      const agents = countAgents();
      const badge = $('#agentsBadge');
      if (badge) badge.textContent = agents.total > 0 ? String(agents.total) : '›';
      $('#homeDot').className = 'dot ok';
      $('#heroDot').className = 'dot ok';
      rows.innerHTML = '';
      if (!list.length) {
        rows.appendChild(el('div', 'empty', '还没有会话'));
        return;
      }
      list.slice(0, 5).forEach((s) => rows.appendChild(sessionRow(s, openChat)));
    } catch (err) {
      $('#homeDot').className = 'dot err';
      $('#heroDot').className = 'dot err';
      $('#heroState').textContent = '连接失败';
      rows.innerHTML = '';
      const box = el('div', 'empty');
      box.innerHTML = '连接失败：' + esc(err.message) +
        '<br><br><span style="color:#5b8dff" id="fixConn">检查连接设置</span>';
      rows.appendChild(box);
      const fix = document.getElementById('fixConn');
      if (fix) fix.addEventListener('click', openSettings);
    }
  }

  async function paintList() {
    const body = $('#listBody');
    const q = ($('#searchInput').value || '').trim().toLowerCase();
    let list = state.sessions;
    if (q) list = list.filter((s) => (s.title || '').toLowerCase().includes(q));
    $('#listCount').textContent = list.length + ' 个会话';
    body.innerHTML = '';
    if (!list.length) {
      body.appendChild(el('div', 'empty', q ? '没有匹配的会话' : '还没有会话'));
      return;
    }
    const groups = new Map();
    for (const s of list) {
      const key = s.cwd || '其他';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const [cwd, rows] of groups) {
      const head = el('div', 'grouphead');
      head.appendChild(el('span', null, shortCwd(cwd)));
      head.appendChild(el('span', 'n', String(rows.length)));
      body.appendChild(head);
      const wrap = el('div', 'rows');
      rows.forEach((s) => wrap.appendChild(sessionRow(s, openChat)));
      body.appendChild(wrap);
    }
  }

  // ---------- chat ----------
  function msgNode(m) {
    const wrap = el('div', 'msg ' + (m.role === 'user' ? 'u' : 'a'));
    wrap.appendChild(el('div', 'who', m.role === 'user' ? '你' : 'DSH'));
    const bub = el('div', 'bub');
    const key = (state.current ? state.current.id : '') + ':' + m.seq;
    const long = (m.text || '').length > 420;
    bub.innerHTML = render(m.text || '');
    if (long && !state.expanded.has(key)) {
      bub.classList.add('clamp');
      const more = el('div', 'more', '展开全文');
      more.addEventListener('click', () => {
        state.expanded.add(key);
        paintChat();
      });
      wrap.appendChild(bub);
      wrap.appendChild(more);
      return wrap;
    }
    wrap.appendChild(bub);
    if (long) {
      const less = el('div', 'more', '收起');
      less.addEventListener('click', () => {
        state.expanded.delete(key);
        paintChat();
      });
      wrap.appendChild(less);
    }
    return wrap;
  }

  function paintChat() {
    const box = $('#chatScroll');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
    box.innerHTML = '';
    if (!state.messages.length) {
      box.appendChild(el('div', 'empty', '还没有消息'));
      return;
    }
    state.messages.forEach((m) => box.appendChild(msgNode(m)));
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  async function openChat(s) {
    state.current = s;
    state.messages = [];
    state.expanded.clear();
    $('#chatTitle').firstChild.nodeValue = s.title || '(untitled)';
    $('#chatSub').textContent = shortCwd(s.cwd);
    $('#chatDot').className = 'dot ' + (s.running ? 'ok' : '');
    show('chat');
    $('#chatScroll').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
    $('#modelPill').textContent = s.model && s.model.model
      ? shortModel(s.model.model) + (s.model.reasoningEffort ? ' · ' + s.model.reasoningEffort : '')
      : '…';
    if (s.model && s.model.model) {
      state.picked = { provider: s.model.provider, model: s.model.model, reasoningEffort: s.model.reasoningEffort };
      localStorage.setItem('dsh.model.' + s.id, JSON.stringify(state.picked));
    }
    await loadChat(true);
    void refreshModelLabel();
    startPolling();
  }

  // ---------- 模型 ----------
  async function refreshModelLabel(keepLocal) {
    if (!state.current) return;
    const key = 'dsh.model.' + state.current.id;
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { cached = null; }
    try {
      const data = await api('/api/models?sessionId=' + encodeURIComponent(state.current.id));
      state.catalog = data.catalog || null;
      const cur = state.catalog && state.catalog.current;
      const shown = cur && cur.model ? cur : cached;
      state.picked = shown && shown.model ? shown : null;
      $('#modelPill').textContent = state.picked
        ? shortModel(state.picked.model) + (state.picked.reasoningEffort ? ' · ' + state.picked.reasoningEffort : '')
        : '选择模型';
    } catch (err) {
      state.picked = cached;
      $('#modelPill').textContent = cached && cached.model
        ? shortModel(cached.model) + (cached.reasoningEffort ? ' · ' + cached.reasoningEffort : '')
        : '模型不可用';
    }
  }

  function shortModel(id) {
    return String(id)
      .replace(/^deepseek-/, 'DeepSeek ')
      .replace(/-v(\d)/i, ' V$1')
      .replace(/-\d{3,4}$/, '')
      .slice(0, 22);
  }

  function openModels() {
    if (!state.current) return;
    $('#msheet').classList.add('on');
    paintModels();
    void refreshModelLabel().then(paintModels);
  }

  function closeModels() { $('#msheet').classList.remove('on'); }

  // ---------- 运行统计 ----------
  function openStats() {
    const s = state.stats;
    const box = $('#sList');
    box.innerHTML = '';
    if (!s) {
      box.innerHTML = '<div class="empty">还没有统计数据</div>';
      $('#ssheet').classList.add('on');
      return;
    }
    const t = s.tokens || {};
    const cached = Number(t.cacheReadTokens || 0);
    const uncached = Number(t.uncachedInputTokens || 0);
    const hit = cached + uncached > 0 ? (cached / (cached + uncached) * 100) : 0;
    const rows = [
      ['轮次', String(s.turns || 0)],
      ['步骤', String(s.steps || 0)],
      ['工具调用', String(s.toolCalls || 0)],
      ['缓存命中', hit.toFixed(0) + '%'],
      ['输入（未缓存）', fmtNum(uncached)],
      ['缓存读取', fmtNum(cached)],
      ['输出', fmtNum(Number(t.outputTokens || 0))],
      ['Token 合计', fmtNum(cached + uncached + Number(t.outputTokens || 0))],
    ];
    for (const [k, v] of rows) {
      const row = el('div', 'statrow');
      row.appendChild(el('span', 'k', k));
      row.appendChild(el('span', 'v', v));
      box.appendChild(row);
    }
    $('#ssheet').classList.add('on');
  }

  function closeStats() { $('#ssheet').classList.remove('on'); }

  function fmtNum(n) {
    if (!n) return '0';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  // ---------- 智能体团队 ----------
  function countAgents() {
    let total = 0;
    let teams = 0;
    for (const s of state.sessions) {
      const a = s.agents || {};
      total += (a.subagents || []).length;
      if ((a.tasks || []).length) teams += 1;
    }
    return { total, teams };
  }

  function paintAgents() {
    const box = $('#agentsBody');
    box.innerHTML = '';
    const list = state.sessions.filter((s) => {
      const a = s.agents || {};
      return (a.subagents || []).length > 0 || (a.tasks || []).length > 0;
    });
    if (list.length === 0) {
      box.innerHTML = '<div class="empty">还没有子智能体或团队任务</div>';
      $('#agentsCount').textContent = '0';
      return;
    }
    let total = 0;
    for (const s of list) {
      const a = s.agents || {};
      const subs = a.subagents || [];
      const tasks = a.tasks || [];
      total += subs.length;
      const head = el('div', 'mgroup');
      head.textContent = s.title + ' · ' + subs.length + ' 个子智能体' +
        (tasks.length ? ' · ' + tasks.length + ' 个团队任务' : '');
      box.appendChild(head);
      for (const sub of subs) {
        const row = el('div', 'mrow');
        const body = el('div', 'mbody');
        body.appendChild(el('div', 'mname', sub.label || sub.id));
        body.appendChild(el('div', 'mdesc', (sub.mode || 'subagent') + ' · ' + ago(sub.createdAt)));
        row.appendChild(body);
        row.addEventListener('click', () => {
          const target = state.sessions.find((x) => x.id === sub.id);
          if (target) openChat(target);
          else toast('子智能体会话不在列表里');
        });
        box.appendChild(row);
      }
      for (const t of tasks) {
        const row = el('div', 'mrow');
        const body = el('div', 'mbody');
        body.appendChild(el('div', 'mname', t.subject || t.id));
        body.appendChild(el('div', 'mdesc', (t.status || 'pending') + (t.owner ? ' · ' + t.owner : '')));
        row.appendChild(body);
        box.appendChild(row);
      }
    }
    $('#agentsCount').textContent = total + ' 个';
  }

  function paintModels() {
    const box = $('#mList');
    box.innerHTML = '';
    const cat = state.catalog;
    if (!cat) {
      box.innerHTML = '<div class="empty">读不到模型目录</div>';
      return;
    }
    const cur = (cat.current && cat.current.model ? cat.current : null) || state.picked || {};
    for (const g of cat.groups || []) {
      if (!g.models || g.models.length === 0) continue;
      box.appendChild(el('div', 'mgroup', g.name));
      for (const m of g.models) {
        const on = m.id === cur.model && (!cur.provider || cur.provider === g.id);
        const row = el('div', 'mrow' + (on ? ' on' : ''));
        const body = el('div', 'mbody');
        body.appendChild(el('div', 'mname', m.name || m.id));
        if (m.description) body.appendChild(el('div', 'mdesc', m.description));
        if (m.efforts && m.efforts.length) {
          const eff = el('div', 'efforts');
          for (const e of m.efforts) {
            const chip = el('span', on && e.id === (cur.reasoningEffort || m.defaultEffort) ? 'on' : '', e.name || e.id);
            chip.addEventListener('click', (ev) => {
              ev.stopPropagation();
              void pickModel(g.id, m.id, e.id);
            });
            eff.appendChild(chip);
          }
          body.appendChild(eff);
        }
        row.appendChild(body);
        if (on) row.appendChild(el('div', 'mcheck', '当前'));
        row.addEventListener('click', () => { void pickModel(g.id, m.id, ''); });
        box.appendChild(row);
      }
    }
    if (!box.childElementCount) box.innerHTML = '<div class="empty">这个会话没有可选模型</div>';
    for (const f of cat.failures || []) {
      if (f.message) box.appendChild(el('div', 'mdesc', f.name + '：' + f.message));
    }
  }

  async function pickModel(provider, model, effort) {
    if (!state.current) return;
    try {
      const data = await api('/api/sessions/' + encodeURIComponent(state.current.id) + '/model', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ provider, model, reasoningEffort: effort }),
      });
      const sel = (data && data.result && data.result.selected) || {};
      const picked = {
        provider: sel.provider || provider,
        model: sel.model || model,
        reasoningEffort: sel.reasoningEffort || effort || '',
      };
      state.picked = picked;
      const label = shortModel(picked.model) +
        (picked.reasoningEffort ? ' · ' + picked.reasoningEffort : '');
      $('#modelPill').textContent = label;
      localStorage.setItem('dsh.model.' + state.current.id, JSON.stringify(picked));
      toast('已切到 ' + label);
      paintModels();
    } catch (err) {
      toast('切换失败：' + err.message);
    }
  }

  async function loadChat(scroll) {
    if (!state.current || state.loadingChat) return;
    state.loadingChat = true;
    try {
      const data = await api('/api/sessions/' + encodeURIComponent(state.current.id) +
        '/messages?limit=40');
      state.messages = data.messages || [];
      state.stats = data.stats || null;
      $('#turnLine').textContent = '共 ' + data.total + ' 条 · ' + ((data.stats && data.stats.turns) || 0) + ' 轮 · 统计';
      paintChat();
      if (scroll) $('#chatScroll').scrollTop = $('#chatScroll').scrollHeight;
    } catch (err) {
      $('#chatScroll').innerHTML = '';
      $('#chatScroll').appendChild(el('div', 'empty', '读取失败：' + err.message));
    } finally {
      state.loadingChat = false;
    }
  }

  function startPolling() {
    stopPolling();
    state.timer = setInterval(() => {
      if (document.hidden) return;
      loadChat(false);
    }, 5000);
  }
  function stopPolling() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  async function send() {
    const input = $('#input');
    const text = input.value.trim();
    if (!text || !state.current) return;
    input.value = '';
    input.style.height = 'auto';
    $('#sendBtn').disabled = true;
    const optimistic = { role: 'user', text, seq: 'local-' + Date.now(), time: Date.now() };
    state.messages.push(optimistic);
    paintChat();
    $('#chatScroll').scrollTop = $('#chatScroll').scrollHeight;
    try {
      await api('/api/sessions/' + encodeURIComponent(state.current.id) + '/send', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ text, mode: 'queue' }),
      });
      toast('已发送');
      setTimeout(() => loadChat(false), 1200);
    } catch (err) {
      toast('发送失败：' + err.message);
      state.messages = state.messages.filter((m) => m !== optimistic);
      paintChat();
    }
  }

  // ---------- settings ----------
  function openSettings() {
    $('#cfgBase').value = base;
    $('#cfgToken').value = token;
    $('#sheet').classList.add('on');
  }
  function closeSettings() { $('#sheet').classList.remove('on'); }

  // ---------- 设置页：主题 ----------
  function currentTheme() { return localStorage.getItem(LS.theme) || 'auto'; }

  function applyTheme(t) {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const mode = t === 'auto' ? (dark ? 'dark' : 'light') : t;
    document.documentElement.dataset.theme = mode;
    try {
      if (window.dshShell && typeof window.dshShell.setDark === 'function') {
        window.dshShell.setDark(mode === 'dark');
      }
    } catch (_) {}
    document.querySelectorAll('[data-theme-btn]').forEach((b) => {
      b.classList.toggle('on', b.dataset.themeBtn === t);
    });
  }

  function setTheme(t) {
    localStorage.setItem(LS.theme, t);
    applyTheme(t);
    toast('主题：' + ({ dark: '深色', light: '浅色', auto: '跟随系统' }[t] || t));
  }

  // ---------- 设置页：连接 / 存储 / 关于 ----------
  function paintConnMeta() {
    let host = base;
    try { host = new URL(base).host; } catch (_) {}
    $('#connMeta').textContent = host + (token ? ' · 令牌已保存' : ' · 未设置令牌');
  }

  async function testConn() {
    const dot = $('#testDot');
    const meta = $('#testMeta');
    meta.textContent = '正在探测…';
    dot.className = 'dot';
    const t0 = Date.now();
    try {
      const info = await api('/api/info');
      const ms = Date.now() - t0;
      dot.className = 'dot ok';
      meta.textContent = (info.host || '电脑') + ' · ' + ms + ' ms · 端口 ' + info.port;
    } catch (err) {
      dot.className = 'dot err';
      meta.textContent = '连不上：' + err.message;
    }
  }

  function lsSize() {
    let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k) || '').length;
    }
    return n;
  }

  function paintStore() {
    const n = lsSize();
    const size = n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
    $('#storeMeta').textContent = '本地设置 ' + size + ' · 消息不落地';
  }

  function clearCache() {
    const keep = {};
    keep[LS.base] = 1; keep[LS.token] = 1; keep[LS.theme] = 1;
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!keep[k]) drop.push(k);
    }
    drop.forEach((k) => localStorage.removeItem(k));
    paintStore();
    refreshModelLabel();
    toast('已清 ' + drop.length + ' 项缓存');
  }

  async function paintAbout() {
    let ver = '—';
    try {
      const info = await api('/api/info');
      ver = info.version || '—';
    } catch (_) {}
    $('#aboutMeta').textContent = 'v' + ver + ' · 端口 8901 · 与桌面控制台相互独立';
  }

  function openSettingsScreen() {
    show('settings');
    paintConnMeta();
    paintStore();
    paintAbout();
    applyTheme(currentTheme());
  }

  function saveSettings() {
    const b = $('#cfgBase').value.trim().replace(/\/+$/, '');
    const t = $('#cfgToken').value.trim();
    if (!/^https?:\/\//.test(b)) { toast('地址要以 http:// 开头'); return; }
    base = b; token = t;
    localStorage.setItem(LS.base, b);
    localStorage.setItem(LS.token, t);
    closeSettings();
    toast('已保存');
    paintRecent();
  }

  // ---------- boot ----------
  function bind() {
    applyTheme(currentTheme());
    if (window.matchMedia) {
      try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(currentTheme())); } catch (_) {}
    }
    $('#openSettings').addEventListener('click', openSettingsScreen);
    document.querySelectorAll('[data-theme-btn]').forEach((b) =>
      b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
    $('#openConn').addEventListener('click', openSettings);
    $('#testConn').addEventListener('click', testConn);
    $('#clearCache').addEventListener('click', clearCache);
    $('#saveCfg').addEventListener('click', saveSettings);
    document.querySelectorAll('[data-close-sheet]').forEach((n) =>
      n.addEventListener('click', closeSettings));
    $('#modelPill').addEventListener('click', openModels);
    document.querySelectorAll('[data-close-msheet]').forEach((n) =>
      n.addEventListener('click', closeModels));
    $('#turnLine').addEventListener('click', openStats);
    document.querySelectorAll('[data-close-ssheet]').forEach((n) =>
      n.addEventListener('click', closeStats));
    document.querySelectorAll('[data-back]').forEach((n) =>
      n.addEventListener('click', () => show(n.dataset.back)));
    $('#gotoAgents').addEventListener('click', async () => {
      show('agents');
      $('#agentsBody').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
      try { await loadSessions(); paintAgents(); }
      catch (err) { $('#agentsBody').innerHTML = '<div class="empty">读取失败：' + esc(err.message) + '</div>'; }
    });
    $('#refreshAgents').addEventListener('click', async () => {
      try { await loadSessions(); paintAgents(); } catch (err) { toast(err.message); }
    });
    $('#gotoList').addEventListener('click', async () => {
      show('list');
      $('#listBody').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
      try { await loadSessions(); paintList(); }
      catch (err) { $('#listBody').innerHTML = '<div class="empty">读取失败：' + esc(err.message) + '</div>'; }
    });
    $('#refreshHome').addEventListener('click', paintRecent);
    $('#refreshList').addEventListener('click', async () => {
      try { await loadSessions(); paintList(); } catch (err) { toast(err.message); }
    });
    $('#refreshChat').addEventListener('click', () => loadChat(true));
    $('#searchInput').addEventListener('input', paintList);
    $('#sendBtn').addEventListener('click', send);
    $('#input').addEventListener('input', (e) => {
      $('#sendBtn').disabled = !e.target.value.trim();
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 132) + 'px';
    });
    $('#input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.current && $('#chatScreen').classList.contains('on')) loadChat(false);
    });
    api('/api/info').then((info) => {
      $('#hostLine').textContent = info.host + ' · ' + info.port;
      $('#heroHost').textContent = info.host;
    }).catch(() => {
      $('#hostLine').textContent = '连不上服务器';
      $('#heroState').textContent = '离线';
    });
  }

  bind();
  paintRecent();
})();
</script>
</body>
</html>
