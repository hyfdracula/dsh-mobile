# agent-mobile-gateway bundle patch: starts an independent HTTP/SSE + E2EE
# gateway for Agent Mobile clients alongside the desktop console.
#
# Activate with:
#   dsh plugin --profile desktop add link:<repo>/packages/dsh-mobile
#
# Deployment values (enabled, port, host, token, logFile) come from the
# profile's own cordis.patch.yml, targeting this row id.
- insert:
    - id: mobile
      name: 'agent-mobile-gateway'
      config:
        port: 8901
        host: '::'
